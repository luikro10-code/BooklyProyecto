<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="Bookly: sistema académico de gestión de bibliotecas.">
  <title>Bookly — Gestión de bibliotecas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#inicio" aria-label="Bookly, inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.8A2.8 2.8 0 0 1 6.8 3H20v15H6.8A2.8 2.8 0 0 0 4 20.8V5.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 6v15m4-14h8m-8 4h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">bookly<span>.</span><small>BIBLIOTECA DIGITAL</small></span>
      </a>
      <div class="nav-caption">MENÚ PRINCIPAL</div>
      <nav class="main-nav" aria-label="Navegación principal">
        <button class="nav-item active" data-page="inicio"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg></span>Inicio</button>
        <button class="nav-item" data-page="libros"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5.8A2.8 2.8 0 0 1 6.8 3H20v15H6.8A2.8 2.8 0 0 0 4 20.8V5.8Z"/><path d="M4 6v15m4-14h8m-8 4h7"/></svg></span>Libros</button>
        <button class="nav-item" data-page="socios"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87m-1-12.13a4 4 0 0 1 0 7.75"/></svg></span>Socios</button>
        <button class="nav-item" data-page="prestamos"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M16 3h5v5m-10 6L21 4"/><path d="M7 7h3m-3 4h3"/></svg></span>Préstamos</button>
        <button class="nav-item" data-page="reportes"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/></svg></span>Reportes</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card">
          <div class="help-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.2 1.8c-1 .9-1.8 1.2-1.8 2.7m0 3h.01"/></svg></div>
          <strong>¿Primera vez aquí?</strong>
          <p>Tu biblioteca, organizada en un solo lugar.</p>
          <a href="README.md" target="_blank">Conocer el proyecto <span aria-hidden="true">→</span></a>
        </div>
        <div class="profile">
          <div class="avatar">BK</div><div><strong>Bibliotecario</strong><small>Administración</small></div>
          <span class="profile-dot" title="Demo local"></span>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="breadcrumb"><span>Biblioteca</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Inicio</strong></div>
        <div class="topbar-actions">
          <span class="today-label" id="today-label"></span>
          <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false" title="Activar modo oscuro">
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/></svg>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
          </button>
          <button class="icon-button" id="quick-add" title="Registrar un préstamo" aria-label="Registrar un préstamo"><svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg></button>
          <div class="top-avatar">BK</div>
        </div>
      </header>

      <div class="content-wrap">
        <div class="demo-banner">
          <span class="demo-pulse"></span>
          <span><strong>Modo demostración</strong> · Datos guardados únicamente en este navegador.</span>
          <a href="README.md" target="_blank">Ver alcance y guía <span aria-hidden="true">↗</span></a>
        </div>
        <section class="page active" id="page-inicio"></section>
        <section class="page" id="page-libros"></section>
        <section class="page" id="page-socios"></section>
        <section class="page" id="page-prestamos"></section>
        <section class="page" id="page-reportes"></section>
      </div>
    </main>
  </div>

  <dialog class="modal" id="form-dialog" aria-labelledby="modal-title">
    <div class="modal-head"><div><span class="eyebrow" id="modal-eyebrow">GESTIÓN</span><h2 id="modal-title">Nuevo registro</h2></div><button class="icon-button close-modal" aria-label="Cerrar">×</button></div>
    <form id="entity-form"></form>
  </dialog>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
